<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesaurus Digital - Cari Sinonim Kata</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        /* Menggunakan style yang kamu berikan dengan sedikit tweak warna */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f0f0f0;
            background-image: repeating-linear-gradient(45deg, #e5e5e5 0, #e5e5e5 1px, transparent 0, transparent 50%);
            background-size: 10px 10px;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        
        .logo {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 15px 30px;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #4ecdc4; /* Warna hijau toska */
            transform: rotate(-1deg);
        }

        .search-section {
            background: #fff;
            border: 4px solid #000;
            box-shadow: 10px 10px 0px #000;
            padding: 25px;
            margin-bottom: 30px;
        }

        .search-box { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 15px;
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #000;
            font-size: 18px;
            font-family: inherit;
            outline: none;
        }
        input:focus { box-shadow: 6px 6px 0px #ff6b6b; }

        button {
            padding: 15px 25px;
            background: #ff6b6b;
            color: #fff;
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #000;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
        }
        button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }

        #result {
            background: #fff;
            border: 4px solid #000;
            box-shadow: 10px 10px 0px #ffe66d;
            padding: 30px;
            display: none;
        }

        .entry { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 3px dashed #000; }
        .label { 
            display: inline-block;
            background: #4ecdc4;
            padding: 5px 10px;
            border: 2px solid #000;
            font-weight: 700;
            margin-bottom: 10px;
            font-family: 'Space Mono', monospace;
        }
        .content { font-size: 18px; line-height: 1.6; color: #333; }
        
        .loader {
            width: 40px; height: 40px;
            border: 5px solid #000;
            border-top-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #ff6b6b; font-weight: 700; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo"><h1>📚 Tesaurus Digital</h1></div>
    </div>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="kataInput" placeholder="Cari sinonim kata...">
            <button onclick="cariSinonim()">Cari</button>
        </div>
    </div>

    <div id="result"></div>
</div>

<script>
    async function cariSinonim() {
        const kata = document.getElementById('kataInput').value.trim();
        const resDiv = document.getElementById('result');
        
        if(!kata) return;

        resDiv.style.display = 'block';
        resDiv.innerHTML = '<div class="loader"></div>';

        try {
            // Ubah URL ini sesuai dengan tempat kamu deploy backend (misal Vercel)
            const response = await fetch(`/api/tesaurus?q=${encodeURIComponent(kata)}`);
            const json = await response.json();

            if(json.error) {
                resDiv.innerHTML = `<p class="error">⚠️ ${json.error}</p>`;
            } else {
                let html = `<h3>Hasil untuk: <u>${json.query}</u></h3><br>`;
                json.data.forEach(item => {
                    html += `
                        <div class="entry">
                            <span class="label">${item.kelas_kata}</span>
                            <div class="content">${item.sinonim.join(', ')}</div>
                        </div>
                    `;
                });
                resDiv.innerHTML = html;
            }
        } catch (e) {
            resDiv.innerHTML = `<p class="error">⚠️ Terjadi kesalahan server.</p>`;
        }
    }
</script>
</body>
</html>
